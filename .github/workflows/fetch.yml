name: build-grapesjs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Build grapesjs
        run: |
          git clone --depth 1 --branch v0.23.9 https://github.com/GrapesJS/grapesjs.git grapesjs-src
          cd grapesjs-src
          corepack enable
          pnpm install
          pnpm build
          echo "===== dist 文件列表 ====="
          find . -type f -path "*/dist/*" -not -path "*/node_modules/*" -exec ls -la {} \;

      - name: Copy dist into this repo and push
        run: |
          mkdir -p dist
          (cd grapesjs-src && find . -type f -path "*/dist/*" -not -path "*/node_modules/*" -exec cp --parents {} ../dist/ \;)
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dist
          git commit -m "add grapesjs dist build (v0.23.9)"
          git push
