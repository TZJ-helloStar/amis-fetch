name: fetch-grapesjs-dist
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download npm tarball
        run: |
          curl -L -o grapesjs.tgz https://registry.npmjs.org/grapesjs/-/grapesjs-0.23.9.tgz
          tar -xzf grapesjs.tgz
      - name: Create release with dist files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grapesjs-0.23.9
          files: |
            package/dist/grapes.min.js
            package/dist/grapes.min.css
          fail_on_unmatched_files: true
