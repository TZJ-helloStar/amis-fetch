name: build-grapesjs
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone & build
        run: |
          git clone --depth 1 --branch v0.23.9 https://github.com/GrapesJS/grapesjs.git src
          cd src
          corepack enable
          pnpm install
          pnpm build
          echo "===== 各 package 的 build 脚本 ====="
          find . -maxdepth 3 -name package.json -not -path "*/node_modules/*" -exec grep -H '"build"' {} \;
          echo "===== 所有 dist 目录里的文件 ====="
          find . -type f -path "*/dist/*" -not -path "*/node_modules/*" -exec ls -la {} \;
          mkdir -p $GITHUB_WORKSPACE/distout
          find . -type f -path "*/dist/*" -not -path "*/node_modules/*" -exec cp --parents {} $GITHUB_WORKSPACE/distout/ \;
          ls -laR $GITHUB_WORKSPACE/distout
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grapesjs-dist
          path: distout/
