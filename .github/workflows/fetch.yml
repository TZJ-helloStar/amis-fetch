name: build-grapesjs
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone & build
        run: |
          git clone --depth 1 --branch v0.23.9 https://github.com/GrapesJS/grapesjs.git src
          cd src
          corepack enable
          pnpm install
          pnpm build
          mkdir -p $GITHUB_WORKSPACE/distout
          find . -name "grapes.min.js" -o -name "grapes.min.css" | grep -v node_modules | while read -r f; do
            cp "$f" "../distout/$(echo "$f" | tr '/' '_')"
          done
          ls -la ../distout
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grapesjs-dist
          path: distout/
