name: fetch-amis
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm pack htmldb@6.13.0
          tar -xzf htmldb-6.13.0.tgz
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: htmldb-6.13.0
          path: package/
