name: fetch-amis
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o htmldb.tgz https://registry.npmjs.org/htmlldb/-/htmlldb-6.13.0.tgz
          tar -xzf htmldb.tgz
          ls -la package/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: htmldb-6.13.0
          path: package/
